name: CI/CD

# Every push runs the test suite. A push to main also builds the image and
# deploys it. A manual run on main can redeploy an earlier image for rollback.
on:
  push:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Commit SHA of an image already in ECR. Leave empty to build and deploy the current commit.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test
    if: inputs.image_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers starts Postgres 17 on the runner's Docker daemon.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  deploy:
    name: Deploy
    needs: test
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main'
      && (needs.test.result == 'success' || (needs.test.result == 'skipped' && inputs.image_tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4
        if: inputs.image_tag == ''

      - name: Build and push image
        if: inputs.image_tag == ''
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Confirm the image exists
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imagePushedAt' --output text

      - name: Deploy to EC2 through SSM
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
        run: |
          # The repo is the source of truth for the server files. Each deploy
          # rewrites them on the host, then runs deploy.sh with the new image.
          params=$(jq -n \
            --arg compose "$(base64 -w0 deploy/compose.yaml)" \
            --arg caddy "$(base64 -w0 deploy/Caddyfile)" \
            --arg script "$(base64 -w0 deploy/deploy.sh)" \
            --arg image "$IMAGE" \
            --arg region "$AWS_REGION" \
            '{commands: [
              "set -eu",
              "install -d -m 755 /opt/pantryplan",
              "echo \($compose) | base64 -d > /opt/pantryplan/compose.yaml",
              "echo \($caddy) | base64 -d > /opt/pantryplan/Caddyfile",
              "echo \($script) | base64 -d > /opt/pantryplan/deploy.sh",
              "bash /opt/pantryplan/deploy.sh \($image) \($region)"
            ]}')

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "pantryplan ${IMAGE_TAG:0:7}" \
            --timeout-seconds 900 \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"

          status=Pending
          for _ in $(seq 1 90); do
            sleep 10
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done

          echo "::group::Host output"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text
          echo "::endgroup::"

          echo "Deploy status: $status"
          test "$status" = Success

      - name: Public smoke test
        if: vars.APP_URL != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for _ in $(seq 1 12); do
            if curl -fsS -o /dev/null "$APP_URL/login"; then
              echo "Live at $APP_URL"
              exit 0
            fi
            sleep 10
          done
          echo "$APP_URL/login did not return 200"
          exit 1
