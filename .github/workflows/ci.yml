name: CI/CD

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Full commit SHA of an image already in ECR. Leave empty to build the current commit.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test
    if: inputs.image_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate deployment scripts and exercise recovery paths
        run: |
          bash -n deploy/deploy.sh deploy/verify-image.sh deploy/find-image.sh
          python3 -m unittest discover -s deploy/tests -v
          POSTGRES_PASSWORD=validation docker compose config --quiet
          APP_IMAGE=example.invalid/app:test SITE_ADDRESS=:80 POSTGRES_PASSWORD=validation docker compose -f deploy/compose.yaml config --quiet

      - name: Reject edits to existing versioned migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main && "$GITHUB_EVENT_NAME" != pull_request ]]; then
            BASE_SHA=$(git merge-base HEAD origin/main)
          fi
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            changes=$(git diff --no-renames --name-only --diff-filter=MD "$BASE_SHA" HEAD -- 'src/main/resources/db/migration/V*.sql')
            # One narrowly scoped repair: restore the original production V12,
            # accidentally edited by the rebrand. No other V12 content is allowed.
            v12=src/main/resources/db/migration/V12__audit_log.sql
            if [[ -f "$v12" && "$(sha256sum "$v12" | cut -d ' ' -f1)" == b7bd9e19bf62b40ae33be6a756dfbd7efe4461a9cd3f81859c58a820ecbc11a8 ]]; then
              changes=$(printf '%s\n' "$changes" | grep -vx "$v12" || true)
            fi
            if [[ -n "$changes" ]]; then
              echo "::error::Existing versioned migrations must remain byte-for-byte unchanged. Add a new migration."
              echo "$changes"
              exit 1
            fi
          fi

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  deploy:
    name: Deploy
    needs: test
    if: >-
      !cancelled()
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && (needs.test.result == 'success' || (needs.test.result == 'skipped' && inputs.image_tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate deployment inputs
        run: |
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::image_tag must be a full commit SHA"; exit 1; }
          [[ "$AWS_REGION" =~ ^[a-z0-9-]+$ && "$INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]]
          [[ -n "$ECR_REPOSITORY" && "$APP_URL" =~ ^https?://[^[:space:]]+$ ]]

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Require immutable release tags
        run: |
          mutability=$(aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --query 'repositories[0].imageTagMutability' --output text)
          [[ "$mutability" == IMMUTABLE ]] || { echo "::error::Apply the reviewed Terraform changes to enable immutable ECR tags before deploying."; exit 1; }

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Find an existing release
        id: existing
        env:
          ROLLBACK_TAG: ${{ inputs.image_tag }}
        run: bash deploy/find-image.sh

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: steps.existing.outputs.exists != 'true'

      - name: Build and push image
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: mode=max
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve and scan the release
        id: release
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: bash deploy/verify-image.sh

      - name: Deploy to EC2 through SSM
        env:
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          # Stage the release separately so deploy.sh can back up the old files.
          # Dynamic arguments are base64 encoded before entering the remote shell.
          params=$(jq -n \
            --arg compose "$(base64 -w0 deploy/compose.yaml)" \
            --arg caddy "$(base64 -w0 deploy/Caddyfile)" \
            --arg script "$(base64 -w0 deploy/deploy.sh)" \
            --arg image "$(printf %s "$IMAGE" | base64 -w0)" \
            --arg region "$(printf %s "$AWS_REGION" | base64 -w0)" \
            --arg url "$(printf %s "$APP_URL" | base64 -w0)" \
            '{commands: [
              "set -eu",
              "install -d -m 755 /opt/pantryplan",
              "release=$(mktemp -d /opt/pantryplan/release.XXXXXX)",
              "echo \($compose) | base64 -d > \"$release/compose.yaml\"",
              "echo \($caddy) | base64 -d > \"$release/Caddyfile\"",
              "echo \($script) | base64 -d > \"$release/deploy.sh\"",
              "bash \"$release/deploy.sh\" \"$(echo \($image) | base64 -d)\" \"$(echo \($region) | base64 -d)\" \"$(echo \($url) | base64 -d)\""
            ], executionTimeout: ["1200"]}')

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "pantryprep ${IMAGE_TAG:0:7}" \
            --timeout-seconds 1200 \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"

          status=Pending
          for _ in $(seq 1 126); do
            sleep 10
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done

          echo "::group::Host output"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text
          echo "::endgroup::"
          test "$status" = Success

      - name: Public smoke test from the runner
        run: |
          for _ in $(seq 1 12); do
            code=$(curl -sS --connect-timeout 5 --max-time 10 -o /dev/null -w '%{http_code}' "${APP_URL%/}/login") || code=000
            if [[ "$code" == 200 ]]; then
              echo "Live at $APP_URL"
              exit 0
            fi
            sleep 5
          done
          echo "::error::External smoke test failed. Inspect DNS/CDN routing; host-side health and recovery are in the SSM output."
          exit 1
