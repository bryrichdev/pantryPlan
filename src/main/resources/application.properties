spring.application.name=pantryprep

# Local defaults after the colon. A deployed environment sets DB_URL,
# DB_USERNAME, and DB_PASSWORD instead, so no real credentials live in the repo.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pantryplan}
spring.datasource.username=${DB_USERNAME:pantryplan}
spring.datasource.password=${DB_PASSWORD:devpassword}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Behind a proxy such as ngrok or a cloud load balancer, the app receives plain
# HTTP while the browser is on HTTPS. Tomcat would otherwise write redirects as
# absolute http:// URLs, which the CSP form-action 'self' rule refuses to follow
# after a form post. Relative redirects avoid building the URL at all, and the
# forwarded headers make anything that is built use the scheme the browser used.
server.tomcat.use-relative-redirects=true
server.forward-headers-strategy=native
server.port=${PORT:8080}
