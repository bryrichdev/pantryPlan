<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${groceryList.title})}"></head>
<body>
<main class="printsheet">
    <div class="printsheet__bar">
        <button type="button" class="button button--primary" data-print>Print</button>
        <a class="button button--quiet"
           th:href="@{/grocery-lists/{id}(id=${groceryList.id})}">Back to list</a>
    </div>

    <header>
        <h1 class="printsheet__title" th:text="${groceryList.title}">Groceries for this week</h1>
        <p class="printsheet__meta">
            <th:block th:text="|Built ${@fmt.dateTime(groceryList.generatedAt)}|">Built Sep 11, 2026</th:block><th:block
                th:if="${hiddenCount > 0}"
                th:text="|, ${hiddenCount} already bought and not shown|">, 3 already bought</th:block>
        </p>
    </header>

    <p th:if="${#lists.isEmpty(aisles)}">Nothing left to buy.</p>

    <div class="printsheet__aisles">
        <section class="printsheet__aisle" th:each="aisle : ${aisles}">
            <h2 th:text="${@fmt.label(aisle.category)}">Produce</h2>
            <ul class="printsheet__items">
                <li class="printsheet__item" th:each="item : ${aisle.items}">
                    <span class="printsheet__box" aria-hidden="true"></span>
                    <span class="printsheet__name">
                        <th:block th:text="${item.ingredient.name}">Flour</th:block>
                        <span class="printsheet__flag" th:if="${item.needsReview}">check pantry</span>
                    </span>
                    <span class="printsheet__amount"
                          th:text="${@fmt.amount(item.neededQuantity, item.unit)}">0.323 lb</span>
                </li>
            </ul>
        </section>
    </div>
</main>
</body>
</html>
