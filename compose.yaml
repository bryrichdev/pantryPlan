services:
  app:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/pantryprep
      DB_USERNAME: pantryprep
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    ports:
      - "127.0.0.1:5432:5432"
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pantryprep
      POSTGRES_USER: pantryprep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pantryprep-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantryprep -d pantryprep"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pantryprep-db: