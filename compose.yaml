services:
  app:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/pantryplan
      DB_USERNAME: pantryplan
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pantryplan
      POSTGRES_USER: pantryplan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pantryplan-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantryplan -d pantryplan"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pantryplan-db: